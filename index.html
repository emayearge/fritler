.alt{color:#6b7885;font-size:12px;margin-top:6px} .say{color:#6b7885;font-size:13px;margin:8px 2px}
.durum{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:7px} .durum .rz{margin:0}
.tarih{color:#2f3a46;font-size:13px}
.bos{color:#6b7885;text-align:center;padding:30px 0}
</style></head><body><header><h1>Frit konumları</h1><p>Son güncelleme: 20.11.2026 08:26</p></header><main>

<script>
const V=[{"a": "Mavi zemin 2119 (örnek)", "k": "Arşiv / Dolap 2 / Kutu 7", "d": "arsiv", "y": "uygun", "t": "04.11.2026"}, {"a": "Yeşil pigmentli 2258 (örnek)", "k": "Laboratuvar / Dolap 11 / Kutu 8", "d": "stokta", "y": "uygun", "t": "02.11.2026"}, {"a": "Titanyum beyaz 2131 (örnek)", "k": "Laboratuvar / Dolap 4 / Kutu 2", "d": "stokta", "y": "red", "t": "23.10.2026"}, {"a": "Mavi zemin 2247 (örnek)", "k": "Laboratuvar / Dolap 3 / Kutu 4", "d": "stokta", "y": "uygun", "t": "20.10.2026"}, {"a": "Şeffaf örtü 2218 (örnek)", "k": "Laboratuvar / Dolap 11 / Kutu 4", "d": "stokta", "y": "bekliyor", "t": "11.10.2026"}, {"a": "Şeffaf örtü 2248 (örnek)", "k": "Laboratuvar / Dolap 7 / Kutu 3", "d": "stokta", "y": "uygun", "t": "23.09.2026"}, {"a": "Titanyum beyaz 2130 (örnek)", "k": "Laboratuvar / Dolap 10 / Kutu 2", "d": "stokta", "y": "red", "t": "18.09.2026"}, {"a": "Yeşil pigmentli 2224 (örnek)", "k": "Arşiv / Dolap 2 / Kutu 5", "d": "arsiv", "y": "uygun", "t": "16.09.2026"}, {"a": "Titanyum beyaz 2124 (örnek)", "k": "Arşiv / Dolap 2 / Kutu 2", "d": "arsiv", "y": "uygun", "t": "28.08.2026"}, {"a": "Akrilik dirençli 2315 (örnek)", "k": "Laboratuvar / Dolap 1 / Kutu 2", "d": "stokta", "y": "sartli", "t": "23.08.2026"}, {"a": "Krem örtü 2137 (örnek)", "k": "Arşiv / Dolap 2 / Kutu 7", "d": "arsiv", "y": "bekliyor", "t": "23.08.2026"}, {"a": "Antrasit zemin 2111 (örnek)", "k": "Arşiv / Dolap 8 / Kutu 6", "d": "arsiv", "y": "bekliyor", "t": "12.08.2026"}, {"a": "Krem örtü 2312 (örnek)", "k": "Arşiv / Dolap 6 / Kutu 7", "d": "arsiv", "y": "red", "t": "31.07.2026"}, {"a": "Antrasit zemin 2126 (örnek)", "k": "Laboratuvar / Dolap 2 / Kutu 1", "d": "stokta", "y": "uygun", "t": "29.07.2026"}, {"a": "Akrilik dirençli 2305 (örnek)", "k": "Laboratuvar / Dolap 9 / Kutu 5", "d": "stokta", "y": "sartli", "t": "14.07.2026"}, {"a": "Antrasit zemin 2338 (örnek)", "k": "Laboratuvar / Dolap 10 / Kutu 8", "d": "stokta", "y": "uygun", "t": "05.07.2026"}, {"a": "Kobalt mavi 2130 (örnek)", "k": "Ar const tr=t=>String(t||"").replace(/I/g,"ı").replace(/İ/g,"i").toLowerCase();
const an=t=>tr(t).replace(/[\s\-_.,/]+/g,"");
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const rz=(S,k)=>S[k]?`<span class="rz" style="background:${S[k][1]};color:${S[k][2]}">${esc(S[k][0])}</span>`:"";
function goster(){const kel=[];tr(s.q).split(/\s+/).map(an).filter(Boolean).forEach(k=>
k.length===1&&kel.length?kel[kel.length-1]+=k:kel.push(k));

document.getElementById("say").textContent=L.length+" / "+V.length+" frit";

document.getElementById("q").addEventListener("input",e=>{s.q=e.target.value;goster();});
document.querySelectorAll(".cip").forEach(b=>b.addEventListener("click",()=>{const g=b.dataset.g;
s[g]=s[g]===b.dataset.v?"":b.dataset.v;document.querySelectorAll(`.cip[data-g="${g}"]`).forEach(x=>
x.classList.toggle("on",x.dataset.v===s[g]));goster();}));
goster();
</script></body></html>
